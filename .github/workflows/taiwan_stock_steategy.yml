name: Separate Stock Monitors

on:
  push:
    paths:
      - 'esmt.py'
      - 'etf878.py'
      - 'tsmc.py'
      - 'etf56.py'
      - '.github/workflows/taiwan_stock_steategy.yml'
  schedule:
    - cron: '5 1 * * 1-5'  # 台灣 09:05
    - cron: '35 5 * * 1-5' # 台灣 13:35
  workflow_dispatch:
    inputs:
      target:
        description: '要執行的腳本（all = 全部四支）'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - esmt.py
          - etf878.py
          - tsmc.py
          - etf56.py

jobs:
  run-all-monitors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (一次裝好所有套件)
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance twstock

      - name: Run Scripts
        env:
          # 這裡必須對應你截圖中的 Secret 名稱
          TARGET: ${{ github.event.inputs.target || 'all' }}
          TSMC_TOKEN: ${{ secrets.TSMC_BOT_TOKEN }}
          ETF878_TOKEN: ${{ secrets.I00878_BOT_TOKEN }}
          ETF56_TOKEN: ${{ secrets.I0056_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 手動觸發可指定單一腳本；push／排程觸發時 TARGET 預設為 all，行為與原本相同
          if [ "$TARGET" = "all" ]; then
            SCRIPTS="esmt.py etf878.py tsmc.py etf56.py"
          else
            SCRIPTS="$TARGET"
          fi
          status=0
          for s in $SCRIPTS; do
            echo "::group::$s"
            python "$s" || { echo "::warning::$s 執行失敗 (exit $?)"; status=1; }
            echo "::endgroup::"
          done
          exit $status
