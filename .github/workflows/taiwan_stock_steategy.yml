name: Separate Stock Monitors

on:
  push:
  schedule:
    - cron: '5 1 * * 1-5'  # 台灣 09:05
    - cron: '35 5 * * 1-5' # 台灣 13:35
  workflow_dispatch:

jobs:
  run-all-monitors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (一次裝好所有套件)
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance twstock

      - name: Run All Scripts
        env:
          # 這裡必須對應你截圖中的 Secret 名稱
          TSMC_TOKEN: ${{ secrets.TSMC_BOT_TOKEN }}
          ETF878_TOKEN: ${{ secrets.I00878_BOT_TOKEN }}
          ETF56_TOKEN: ${{ secrets.I0056_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 每支獨立執行：任一支失敗不會中斷後面的腳本
          status=0
          for s in esmt.py etf878.py tsmc.py etf56.py; do
            echo "::group::$s"
            python "$s" || { echo "::warning::$s 執行失敗 (exit $?)"; status=1; }
            echo "::endgroup::"
          done
          exit $status
