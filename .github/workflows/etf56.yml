name: ETF 0056 Monitor

on:
  push:
    paths:
      - 'etf56.py'
      - '.github/workflows/etf56.yml'
  schedule:
    - cron: '5 1 * * 1-5'  # 台灣 09:05
    - cron: '35 5 * * 1-5' # 台灣 13:35
  workflow_dispatch:

jobs:
  run-etf56:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance twstock

      - name: Run etf56.py
        env:
          ETF56_TOKEN: ${{ secrets.I0056_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python etf56.py
