name: Send Video Summary to Telegram

on:
  workflow_dispatch:
    inputs:
      summary_file:
        description: '要發送的摘要檔案路徑'
        required: false
        default: 'latest_summary.txt'
        type: string

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Send summary to Telegram
        env:
          SUMMARY_FILE: ${{ github.event.inputs.summary_file }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python video_summary.py
